<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Price Prediction</title>

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/743/743922.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    font-family:'Poppins',sans-serif;
    box-sizing:border-box;
}

body{
    height:100vh;
    margin:0;
    overflow:hidden;
}

/* Background image */
.bg{
    position:fixed;
    inset:0;
    background:url("/static/images/bmw.jpg") no-repeat center center/cover;
    animation:zoomMove 20s ease-in-out infinite alternate;
    z-index:-2;
}

@keyframes zoomMove{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* dark overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* card */
.card{
    width:430px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    box-shadow:0 0 40px rgba(0,0,0,0.7);
    color:white;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

h2{
    text-align:center;
    margin-bottom:5px;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#ddd;
    margin-bottom:18px;
}

/* labels */
label{
    font-size:13px;
    color:#ddd;
    display:block;
    margin-top:10px;
}

/* inputs */
input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
    transition:0.3s;
}

input:focus,select:focus{
    background:rgba(255,255,255,0.35);
    transform:scale(1.03);
}

select option{
    color:black;
}

/* button */
button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border-radius:30px;
    border:none;
    font-size:16px;
    cursor:pointer;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-weight:600;
    letter-spacing:1px;
    transition:0.4s;
    box-shadow:0 0 20px rgba(0,114,255,0.8);
}

button:hover{
    transform:scale(1.06);
    box-shadow:0 0 40px rgba(0,114,255,1);
}

/* result */
.result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(0,255,200,0.15);
    border:1px solid rgba(0,255,200,0.3);
    text-align:center;
    font-size:20px;
    animation:fadeIn 1s ease-in;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* footer */
.footer{
    position:fixed;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#aaa;
    font-size:12px;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">

<div class="card">

<h2>🚗 Car Price Prediction</h2>
<p class="subtitle">Machine Learning Model to Estimate Used Car Prices</p>

<form action="/predict" method="post">

<label>Present Price (Lakhs)</label>
<input type="number" step="0.01" name="present_price" required>

<label>Kilometers Driven</label>
<input type="number" name="kms_driven" min="0" required>

<label>Owner (0 / 1 / 2)</label>
<input type="number" name="owner" min="0" max="3" required>

<label>Car Age (Years)</label>
<input type="number" name="car_age" min="0" max="30" required>

<label>Fuel Type</label>
<select name="fuel_type" required>
<option value="">Select Fuel Type</option>
<option value="Petrol">Petrol</option>
<option value="Diesel">Diesel</option>
</select>

<label>Seller Type</label>
<select name="seller_type" required>
<option value="">Select Seller Type</option>
<option value="Dealer">Dealer</option>
<option value="Individual">Individual</option>
</select>

<label>Transmission</label>
<select name="transmission" required>
<option value="">Select Transmission</option>
<option value="Manual">Manual</option>
<option value="Automatic">Automatic</option>
</select>

<button type="submit" onclick="this.innerText='Predicting...'">
🔮 Predict Car Price
</button>

</form>

{% if prediction_text %}
<div class="result">
<strong>{{ prediction_text }}</strong>
</div>
{% endif %}

</div>
</div>

</body>
</html>
